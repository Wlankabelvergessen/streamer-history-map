name: Streams und Clips aktualisieren

on:
  schedule:
    # alle 15 Minuten: erfasst laufende Streams (Zuschauer, Dauer) und neue Clips.
    # Ungerade Minuten, weil GitHub zur vollen Viertelstunde überlastet ist und Läufe dann oft ausfallen.
    # Zusätzlich kann ein externer Dienst (cron-job.org) den Lauf über die API anstoßen (siehe README).
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Twitch abfragen
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/update.mjs
      - name: Prüfen, ob sich Daten geändert haben
        id: changed
        run: |
          if [ -f .og-needed ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - name: Teilen-Vorschaubild (og.png) erzeugen
        if: steps.changed.outputs.yes == 'true'
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/og.mjs
          rm -f .og-needed
      - name: Änderungen speichern
        run: |
          if git diff --quiet -- data og.png && [ -z "$(git ls-files --others --exclude-standard og.png)" ]; then echo "Keine neuen Daten."; exit 0; fi
          git config user.name "adventure-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data og.png
          git commit -m "Daten aktualisiert: $(date -u +%Y-%m-%d)"
          git push
