.leaflet-marker-icon,

}

<style>
/* Layout: Kopfzeile mit Kennzahlen, links Routenliste/Detail, rechts die Karte; auf dem Handy Karte oben, Liste darunter. */
:root{
  --bg:#120c16;
  --panel:#1a1220;
  --panel-2:#251a2b;
  --line:#3a2a42;
  --fg:#f4ebf3;
  --muted:#ab97b0;
  --accent:#f5a9d6;
  --pink-deep:#c9579f;
  --plum:#3b1d40;
  --cloud:#e9c1de;
  --cloud-2:#c98fbd;
  --accent-ink:#2a0f22;
  --twitch:#9146ff;
  --danger:#ff6b6b;
  --map-bg:#0f0a12;
  --f-bubble:'Rubik Bubbles','Barlow Condensed',system-ui,sans-serif;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.osm-dark{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.5)}
.leaflet-control-layers{background:var(--panel);color:var(--fg);border:1px solid var(--line)!important}
.leaflet-control-layers-expanded{padding:8px 10px}
.leaflet-control-layers label{text-transform:none;letter-spacing:0;font:400 13px var(--f-body);color:var(--fg);margin:2px 0}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Kopfzeile */
/* Kopfbereich im Stil des Kanals: Nachthimmel, rosa Wolken, Bubble-Schrift */
.hero{position:relative;flex:none;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 140% at 50% 0%,#5a2a5e 0%,var(--plum) 45%,#1c0f21 100%)}
.sky{position:absolute;inset:0;pointer-events:none;
  background:
   radial-gradient(1.5px 1.5px at 12% 22%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 23% 48%,#fff9 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 37% 15%,#fffa 50%,transparent 51%),radial-gradient(1px 1px at 61% 30%,#fff8 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 74% 12%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 86% 40%,#fffa 50%,transparent 51%),
   radial-gradient(1px 1px at 93% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 5% 60%,#fff7 50%,transparent 51%)}
.sky::before,.sky::after{content:"";position:absolute;left:-5%;right:-5%;bottom:-2px;height:62%;
  background:
   radial-gradient(closest-side,var(--cloud) 98%,transparent) -4% 100%/22% 90% no-repeat,
   radial-gradient(closest-side,var(--cloud) 98%,transparent) 14% 115%/20% 80% no-repeat,
   radial-gradient(closest-side,var(--cloud) 98%,transparent) 86% 105%/24% 95% no-repeat,
   radial-gradient(closest-side,var(--cloud) 98%,transparent) 104% 100%/20% 85% no-repeat,
   radial-gradient(closest-side,var(--cloud) 98%,transparent) 70% 125%/16% 70% no-repeat;opacity:.9}
.sky::after{height:48%;opacity:.55;filter:blur(1px);
  background:
   radial-gradient(closest-side,var(--cloud-2) 98%,transparent) 26% 100%/18% 80% no-repeat,
   radial-gradient(closest-side,var(--cloud-2) 98%,transparent) 40% 120%/22% 70% no-repeat,
   radial-gradient(closest-side,var(--cloud-2) 98%,transparent) 60% 110%/18% 75% no-repeat,
   radial-gradient(closest-side,var(--cloud-2) 98%,transparent) 0% 90%/14% 60% no-repeat,
   radial-gradient(closest-side,var(--cloud-2) 98%,transparent) 96% 80%/14% 60% no-repeat}
.hero-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 16px 14px}
.avatar{position:relative;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--pink-deep);color:#fff;font:700 22px var(--f-body);text-decoration:none;box-shadow:0 0 0 3px var(--accent),0 6px 18px #0008;overflow:hidden}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

function dist(p){var d=0;for(var i=1;i<p.length;i++){d+=hav(p[i-1],p[i])}return d}
function fmtKm(k){return k.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' km'}
function fmtDur(m){var h=Math.floor(m/60),r=m%60;return (h?h+' Std. ':'')+(r||!h?r+' Min.':'')}
function fmtDate(iso){var d=new Date(iso+'T12:00:00');if(isNaN(d))return iso;return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'long',year:'numeric'})}
function addMin(t,m){var a=(t||'00:00').split(':');var x=(parseInt(a[0],10)*60+parseInt(a[1],10)+m)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}
function pad2(n){return String(n).padStart(2,'0')}
function today(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
var toastTimer;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},2600)}

/* ---------- Zustand ---------- */
var state={ routes:[], selectedId:null, user:null, draft:{points:[],meta:null}, drawing:false, query:'' };
var map, lines={}, selGroup, draftLine;

function prep(r,i){r.km=dist(r.points);r.color=r.color||PALETTE[i%PALETTE.length];return r}
function ownKey(){return 'shm.routes.'+state.user.login}
function loadOwn(){if(!state.user)return[];try{return JSON.parse(store(ownKey())||'[]')}catch(e){return[]}}
function saveOwn(){if(!state.user)return;var own=state.routes.filter(function(r){return r.owner===state.user.login});store(ownKey(),JSON.stringify(own.map(function(r){var c=Object.assign({},r);delete c.km;return c})))}
function loadEdits(){try{return JSON.parse(store('shm.edits')||'{}')||{}}catch(e){return{}}}
function saveEdit(id,patch){var ed=loadEdits();ed[id]=Object.assign(ed[id]||{},patch);store('shm.edits',JSON.stringify(ed))}
function hasRoute(r){return r.points&&r.points.length>1}
function buildRoutes(){
  var ed=loadEdits();
  var all=SAMPLE.map(function(r){return Object.assign({},r,ed[r.id]||{})}).concat(loadOwn());
  all.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
  state.routes=all.map(prep);
}
function byId(id){return state.routes.filter(function(r){return r.id===id})[0]}

/* ---------- Karte ---------- */
function initMap(){
  map=L.map('map',{zoomControl:true,attributionControl:true,preferCanvas:false});
  map.attributionControl.setPrefix(false);
  // OpenStreetMap-Kacheln: kostenlos, ohne API-Key. Per CSS-Filter abgedunkelt.
  var osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,className:'osm-dark',attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende'});
  var none=L.layerGroup();
  // Lokal geöffnet (file://) liefert OSM keine Kacheln, dann nur die eingebettete Karte
  (location.protocol==='file:'?none:osm).addTo(map);
  L.control.layers({'Straßenkarte (OpenStreetMap)':osm,'Nur Umrisse (offline)':none},null,{position:'topright',collapsed:false}).addTo(map);
  // Eingebettete Grundkarte (Natural Earth, Länder): liegt unter den Kacheln und ist sichtbar, wenn keine Kacheln laden
  map.createPane('base');map.getPane('base').style.zIndex=150;
  var cs=getComputedStyle(document.documentElement);
  L.geoJSON(GEO,{pane:'base',interactive:false,style:function(){return {color:cs.getPropertyValue('--muted').trim()||'#8c9ba7',weight:.8,opacity:.55,fillColor:cs.getPropertyValue('--panel-2').trim()||'#19222b',fillOpacity:1}}}).addTo(map);
  CITIES.forEach(function(c){L.marker([c[1],c[2]],{pane:'base',interactive:false,keyboard:false,icon:L.divIcon({className:'city',html:'<i></i><span>'+esc(c[0])+'</span>',iconSize:[0,0]})}).addTo(map)});
  selGroup=L.layerGroup().addTo(map);
  map.setView([53.55,9.99],12);
  map.on('click',function(e){if(!state.drawing)return;state.draft.points.push([+e.latlng.lat.toFixed(6),+e.latlng.lng.toFixed(6)]);updateDraft()});
  if(window.ResizeObserver){new ResizeObserver(function(){map.invalidateSize()}).observe($('#map'))}
}
var groups={},hoverTip=null,tipTimer=null;
var canHover=window.matchMedia&&matchMedia('(hover: hover)').matches;
function groupList(){
  var g={};
  state.routes.forEach(function(r){if(hasRoute(r)||!r.location)return;var k=r.location.name;(g[k]=g[k]||{name:k,lat:r.location.lat,lng:r.location.lng,items:[]}).items.push(r)});
  Object.keys(g).forEach(function(k){g[k].items.sort(function(a,b){return (b.date+b.start).localeCompare(a.date+a.start)})});
  return g;
}
function shortDate(iso){var p=iso.split('-');return p[2]+'.'+p[1]+'.'+p[0].slice(2)}
function groupHtml(g){
  var max=12,rows=g.items.slice(0,max).map(function(r){
    return '<button type="button" class="gp-item" data-id="'+esc(r.id)+'"><span class="gp-d">'+shortDate(r.date)+'</span><span class="gp-t">'+esc(r.title)+'</span><span class="gp-m">'+esc(fmtDur(r.durationMin))+((r.clips||[]).length?' · '+r.clips.length+' Clips':'')+(r.avgViewers!=null?' · Ø '+r.avgViewers:'')+'</span></button>'}).join('');
  var mins=g.items.reduce(function(s,r){return s+r.durationMin},0);
  return '<div class="gp-h"><b>'+esc(g.name)+'</b><span>'+g.items.length+(g.items.length===1?' Stream':' Streams')+' · '+(mins/60).toLocaleString('de-DE',{maximumFractionDigits:1})+' Std.</span></div>'+
    '<div class="gp-l">'+rows+'</div>'+(g.items.length>max?'<button type="button" class="gp-all" data-loc="'+esc(g.name)+'">Alle '+g.items.length+' in der Liste zeigen →</button>':(g.items.length>1?'<button type="button" class="gp-all" data-loc="'+esc(g.name)+'">In der Liste zeigen →</button>':''));
}
function hideTip(now){clearTimeout(tipTimer);var go=function(){if(hoverTip){map.removeLayer(hoverTip);hoverTip=null}};if(now)go();else tipTimer=setTimeout(go,260)}
function showGroup(g){
  if(state.drawing)return;clearTimeout(tipTimer);if(hoverTip)map.removeLayer(hoverTip);
  var pt=map.latLngToContainerPoint([g.lat,g.lng]),right=pt.x<map.getSize().x-340;
  hoverTip=L.tooltip({direction:right?'right':'left',interactive:true,opacity:1,offset:[right?g.size/2+2:-(g.size/2+2),0],className:'grp-tip'}).setLatLng([g.lat,g.lng]).setContent(groupHtml(g)).addTo(map);
  var el=hoverTip.getElement();L.DomEvent.disableClickPropagation(el);L.DomEvent.disableScrollPropagation(el);
  el.addEventListener('mouseenter',function(){clearTimeout(tipTimer)});el.addEventListener('mouseleave',function(){hideTip()});
}
function showInList(name){hideTip(true);setQuery(name);if(state.selectedId)deselect();else showView('list')}
function drawLines(){
  Object.keys(lines).forEach(function(k){map.removeLayer(lines[k])});lines={};
  Object.keys(groups).forEach(function(k){map.removeLayer(groups[k].marker)});groups={};hideTip(true);
  state.routes.forEach(function(r){
    if(!hasRoute(r))return;
    var l=L.polyline(r.points,{color:r.color,weight:3,opacity:.5,lineCap:'round',lineJoin:'round'}).addTo(map);
    l.on('click',function(){if(!state.drawing)select(r.id)});
    lines[r.id]=l;
  });
  var gl=groupList();
  Object.keys(gl).forEach(function(k){
    var g=gl[k],n=g.items.length;g.size=Math.round(26+Math.min(n,25)*1.3);
    var m=L.marker([g.lat,g.lng],{keyboard:true,title:g.name+' · '+n+' Streams',riseOnHover:true,
      icon:L.divIcon({className:'',html:'<div class="grp" style="width:'+g.size+'px;height:'+g.size+'px">'+n+'</div>',iconSize:[g.size,g.size],iconAnchor:[g.size/2,g.size/2]})}).addTo(map);
    if(canHover){m.on('mouseover',function(){showGroup(g)});m.on('mouseout',function(){hideTip()})}
    m.on('click',function(){if(state.drawing)return;if(n===1){hideTip(true);select(g.items[0].id)}else showGroup(g)});
    m.on('keypress',function(e){if(e.originalEvent.key==='Enter')showGroup(g)});
    g.marker=m;groups[k]=g;
  });
  map.off('click',hideTipOnMap);map.on('click',hideTipOnMap);
}
function hideTipOnMap(){hideTip(true)}
function dimAll(id){
  var r=byId(id),loc=r&&!hasRoute(r)&&r.location?r.location.name:null;
  Object.keys(lines).forEach(function(k){lines[k].setStyle({opacity:k===id?0:.28})});
  Object.keys(groups).forEach(function(k){groups[k].marker.setOpacity(k===loc?1:.35)});
}
function undimAll(){
  Object.keys(lines).forEach(function(k){lines[k].setStyle({opacity:.5})});
  Object.keys(groups).forEach(function(k){groups[k].marker.setOpacity(1)});
}
function fitAll(){var pts=[];state.routes.forEach(function(r){if(hasRoute(r))pts=pts.concat(r.points);else if(r.location)pts.push([r.location.lat,r.location.lng])});if(pts.length){map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:13,animate:false})}}
function icon(cls,txt,size){return L.divIcon({className:'',html:'<div class="pin '+cls+'" style="width:'+size+'px;height:'+size+'px">'+txt+'</div>',iconSize:[size,size],iconAnchor:[size/2,size/2],popupAnchor:[0,-size/2]})}
function animateLine(line){
  if(reduceMotion)return;var el=line.getElement&&line.getElement();if(!el||!el.getTotalLength)return;
  var len=el.getTotalLength();el.style.strokeDasharray=len;el.style.strokeDashoffset=len;el.getBoundingClientRect();
  el.style.transition='stroke-dashoffset 900ms ease-out';el.style.strokeDashoffset=0;
  setTimeout(function(){el.style.strokeDasharray='';el.style.strokeDashoffset='';el.style.transition=''},960);
}
var stopMarkers=[];
function select(id){
  var r=byId(id);if(!r)return;state.selectedId=id;
  dimAll(id);hideTip(true);
  selGroup.clearLayers();stopMarkers=[];
  if(hasRoute(r)){
    map.fitBounds(L.polyline(r.points).getBounds(),{padding:[50,50],maxZoom:16,animate:false});
    var sel=L.polyline(r.points,{color:r.color,weight:5,opacity:1,lineCap:'round',lineJoin:'round'}).addTo(selGroup);
    animateLine(sel);
    L.marker(r.points[0],{icon:icon('pin-start','S',22),keyboard:false}).addTo(selGroup);
    L.marker(r.points[r.points.length-1],{icon:icon('pin-end','Z',22),keyboard:false}).addTo(selGroup);
  }else if(r.location){
    map.setView([r.location.lat,r.location.lng],12,{animate:false});
    L.circleMarker([r.location.lat,r.location.lng],{radius:22,color:'#fff',weight:2,fill:false,dashArray:'3 5',interactive:false}).addTo(selGroup).bindTooltip(esc(r.location.name)+' (ungefähr)',{permanent:true,direction:'top',offset:[0,-20]});
  }
  (r.stops||[]).forEach(function(s,i){
    var m=L.marker([s.lat,s.lng],{icon:icon('pin-stop',String(i+1),24),title:s.name}).addTo(selGroup);
    m.bindPopup('<strong>'+esc(s.name)+'</strong><br><small>'+esc(s.time||'')+'</small><br>'+esc(s.note||''));
    stopMarkers.push(m);
  });
  renderDetail(r);showView('detail');renderListSelection();
}
function deselect(){
  state.selectedId=null;selGroup.clearLayers();
  undimAll();
  fitAll();showView('list');
}

/* ---------- Ansichten ---------- */
function showView(v){
  $('#v-list').hidden=v!=='list';$('#v-detail').hidden=v!=='detail';$('#v-form').hidden=v!=='form';
  $('#panel').scrollTop=0;
}
function renderStats(){
  var min=0,clips=0,places={};state.routes.forEach(function(r){min+=r.durationMin;clips+=(r.clips||[]).length;if(r.location)places[r.location.name.split(',')[0]]=1});
  var f=function(n){return n.toLocaleString('de-DE',{maximumFractionDigits:1})};
  $('#stats').innerHTML='<div><b>'+f(state.routes.length)+'</b><small>Streams</small></div><div><b>'+f(min/60)+'</b><small>Stunden</small></div><div><b>'+f(clips)+'</b><small>Clips</small></div><div><b>'+Object.keys(places).length+'</b><small>Städte</small></div>';
}
function renderList(){
  var q=state.query.trim().toLowerCase();
  var f=state.filter||'all';
  var rows=state.routes.filter(function(r){
    if(f==='loc'&&!(r.location||hasRoute(r)))return false;
    if(f==='route'&&!hasRoute(r))return false;
    if(f==='none'&&(r.location||hasRoute(r)))return false;
    if(!q)return true;
    var hay=[r.title,r.desc,fmtDate(r.date),r.date,r.location?r.location.name:''].concat((r.stops||[]).map(function(s){return s.name})).join(' ').toLowerCase();
    return hay.indexOf(q)>=0;
  });
  var srt=state.sort||'new';
  var key=function(r){return r.date+' '+(r.start||'')};
  var num=function(v){return v==null?-Infinity:v};
  rows.sort(function(a,b){
    var d;
    if(srt==='old')return key(a)<key(b)?-1:key(a)>key(b)?1:0;
    if(srt==='fol')d=num(b.followers)-num(a.followers);
    else if(srt==='avg')d=num(b.avgViewers)-num(a.avgViewers);
    else if(srt==='max')d=num(b.maxViewers)-num(a.maxViewers);
    else if(srt==='time')d=b.durationMin-a.durationMin;
    if(d)return d;
    return key(a)<key(b)?1:key(a)>key(b)?-1:0;
  });
  $('#count').textContent=rows.length+' von '+state.routes.length+' Streams';
  $('#list').innerHTML=rows.length?rows.map(function(r){
    return '<button type="button" class="card" data-id="'+esc(r.id)+'" aria-pressed="'+(r.id===state.selectedId)+'">'+
      '<div class="d"><span class="dot" style="background:'+r.color+'"></span>'+esc(fmtDate(r.date))+' · '+esc(r.start||'')+routeTag(r)+'</div>'+
      '<h3>'+esc(r.title)+'</h3>'+
      '<div class="m"><span>'+esc(fmtDur(r.durationMin))+'</span>'+(r.location?'<span>'+esc(r.location.name)+'</span>':'')+(r.avgViewers!=null?'<span'+(state.sort==='avg'?' class="hl"':'')+'>Ø '+r.avgViewers+' Zuschauer</span>':'')+(r.maxViewers!=null&&state.sort==='max'?'<span class="hl">Max. '+r.maxViewers.toLocaleString('de-DE')+'</span>':'')+(r.followers!=null&&(state.sort==='fol')?'<span class="hl">'+(r.followers>0?'+':'')+r.followers.toLocaleString('de-DE')+' Follower</span>':'')+((r.clips||[]).length?'<span>'+r.clips.length+(r.clips.length===1?' Clip':' Clips')+'</span>':'')+'</div></button>';
  }).join(''):'<p class="empty">Keine Route gefunden.</p>';
  $('#listhint').textContent=canEdit(state.user)?'':(state.user?'Nur naschiitaschii und ihre Mods können Streams hinzufügen oder bearbeiten.':'naschiitaschii und ihre Mods können sich mit Twitch anmelden, um Routen und Clips zu ergänzen.');
  $('#listhint').hidden=canEdit(state.user);
}
function routeTag(r){if(hasRoute(r))return '';return r.location?'<span class="tag">ORT UNGEFÄHR</span>':''}
function renderListSelection(){var cs=document.querySelectorAll('.card');for(var i=0;i<cs.length;i++){cs[i].setAttribute('aria-pressed',cs[i].dataset.id===state.selectedId)}}
function gmapsUrl(r){
  var p=r.points,n=p.length,w=[],max=8;
  if(n>2){for(var i=1;i<=max;i++){var idx=Math.round(i*(n-1)/(max+1));if(idx>0&&idx<n-1)w.push(p[idx].join(','))}}
  var u='https://www.google.com/maps/dir/?api=1&travelmode=walking&origin='+p[0].join(',')+'&destination='+p[n-1].join(',');
  if(w.length)u+='&waypoints='+encodeURIComponent(w.filter(function(x,i){return w.indexOf(x)===i}).join('|'));
  return u;
}
function safeUrl(u){try{var x=new URL(u);return x.protocol==='https:'?x.href:null}catch(e){return null}}

  $('#v-detail').innerHTML=
    '<button type="button" class="back" id="back">← Alle Streams</button>'+
    '<div class="when"><span class="dot" style="background:'+r.color+'"></span>'+esc(fmtDate(r.date))+routeTag(r)+'</div>'+
    '<h2>'+esc(r.title)+'</h2>'+
    '<div class="facts"><div><b>'+esc(fmtDur(r.durationMin))+'</b><small>Dauer</small></div><div><b>'+esc(r.start||'–')+(r.start?'–'+addMin(r.start,r.durationMin):'')+'</b><small>Uhrzeit</small></div><div><b>'+CL.length.toLocaleString('de-DE')+'</b><small>Clips</small></div>'+
    (r.avgViewers!=null?'<div><b>'+r.avgViewers+'</b><small>Ø Zuschauer</small></div><div><b>'+r.maxViewers.toLocaleString('de-DE')+'</b><small>Max. Zuschauer</small></div><div><b>'+(r.followers>0?'+':'')+r.followers.toLocaleString('de-DE')+'</b><small>Follower</small></div>':'')+
    '</div>'+
    routeInfo+
    (r.desc?'<p class="desc">'+esc(r.desc)+'</p>':'')+
    (stops?'<div class="sec"><h3>Stationen</h3><ol class="stops">'+stops+'</ol></div>':'')+
    '<div class="sec"><h3>Clips'+(CL.length?' · '+CL.length:'')+'</h3>'+(clips?'<div class="clips">'+clips+'</div>':'<p class="note">Noch keine Clips verlinkt. <a href="https://www.twitch.tv/'+CHANNEL+'/clips?filter=clips&range=all" target="_blank" rel="noopener noreferrer">Clips auf Twitch ansehen ↗</a></p>')+'</div>'+
    '<div class="actions">'+(hasRoute(r)?'<a class="btn" href="'+esc(gmapsUrl(r))+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:var(--fg)">In Google Maps öffnen ↗</a>':'')+
    (canEdit(state.user)?'<button type="button" class="btn primary" id="edit">Bearbeiten</button>':'')+

    ((r.avgViewers!=null||CL.length)?'<p class="note src-note">'+[r.avgViewers!=null?'Zuschauer & Follower: TwitchTracker':'',CL.length?'Clips: Twitch, nach Aufrufen sortiert':''].filter(Boolean).join(' · ')+'</p>':'');
}
/* ---------- Zeichnen & GPX ---------- */
function updateDraft(){
  var p=state.draft.points;
  if(draftLine){map.removeLayer(draftLine);draftLine=null}
  if(p.length){draftLine=L.polyline(p,{color:'#f5a9d6',weight:4,dashArray:'6 8'}).addTo(map)}
  $('#drawinfo').textContent=p.length+' Punkte · '+fmtKm(dist(p));
  $('#route-status').textContent=p.length?p.length+' Punkte, '+fmtKm(dist(p)):'Noch keine Route.';
}
function setDrawing(on){
  state.drawing=on;$('#drawbar').hidden=!on;$('#map').classList.toggle('drawing',on);
  if(on){toast('Auf die Karte tippen, um Punkte zu setzen.')}
}
function parseGpx(text){
  var doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('Die Datei ist keine gültige GPX-Datei.');
  var nodes=doc.getElementsByTagName('trkpt');if(!nodes.length)nodes=doc.getElementsByTagName('rtept');
  var pts=[],t0=null,t1=null;
  for(var i=0;i<nodes.length;i++){
    var la=parseFloat(nodes[i].getAttribute('lat')),lo=parseFloat(nodes[i].getAttribute('lon'));
    if(isNaN(la)||isNaN(lo))continue;pts.push([+la.toFixed(6),+lo.toFixed(6)]);
    var te=nodes[i].getElementsByTagName('time')[0];
    if(te){var d=new Date(te.textContent);if(!isNaN(d)){if(!t0)t0=d;t1=d}}
  }
  if(pts.length<2)throw new Error('Die GPX-Datei enthält keine Strecke.');
  var step=Math.ceil(pts.length/1500);if(step>1){var last=pts[pts.length-1];pts=pts.filter(function(_,i){return i%step===0});pts.push(last)}
  return {points:pts,t0:t0,t1:t1};
}
function openForm(editId){
  var r=editId?byId(editId):null;state.editId=r?r.id:null;
  state.draft={points:r&&r.points?r.points.slice():[],meta:null};$('#v-form').reset();$('#f-err').textContent='';
  $('#f-head').textContent=r?'Stream bearbeiten':'Neuer Stream';
  $('#f-title').value=r?r.title:'';$('#f-date').value=r?r.date:today();$('#f-start').value=r?(r.start||''):'';$('#f-dur').value=r?r.durationMin:'';
  $('#f-desc').value=r?(r.desc||''):'';$('#f-clips').value=r?(r.clips||[]).map(function(c){return c.title+' | '+c.url}).join('\n'):'';
  updateDraft();selGroup.clearLayers();
  if(r&&r.location&&!hasRoute(r)){map.setView([r.location.lat,r.location.lng],13)}
  else if(hasRoute(r||{})){map.fitBounds(L.polyline(r.points).getBounds(),{padding:[50,50]})}
  state.selectedId=null;showView('form');$('#f-title').focus();
}
function closeForm(){
  setDrawing(false);if(draftLine){map.removeLayer(draftLine);draftLine=null}
  undimAll();showView('list');
}
function parseClips(txt){
  return txt.split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l,i){
    var parts=l.split('|'),url=safeUrl((parts.length>1?parts[parts.length-1]:parts[0]).trim());
    return url?{title:parts.length>1?parts.slice(0,-1).join('|').trim():'Clip '+(i+1),url:url}:null;
  }).filter(Boolean);
}
function submitForm(e){
  e.preventDefault();var err=$('#f-err');
  if(!canEdit(state.user)){err.textContent='Nur naschiitaschii und ihre Mods können Streams speichern.';return}
  var title=$('#f-title').value.trim(),date=$('#f-date').value,dur=parseInt($('#f-dur').value,10);
  if(!title){err.textContent='Bitte einen Titel eingeben.';return}
  if(!date){err.textContent='Bitte ein Datum wählen.';return}
  if(!dur||dur<1){err.textContent='Bitte die Dauer in Minuten angeben.';return}
  
  var fields={title:title,date:date,start:$('#f-start').value||'',durationMin:dur,desc:$('#f-desc').value.trim(),points:state.draft.points.slice(),clips:parseClips($('#f-clips').value)};
  var r,ex=state.editId?byId(state.editId):null;
  if(ex&&!ex.owner){saveEdit(ex.id,fields);Object.assign(ex,fields);ex.km=dist(ex.points);r=ex}
  else if(ex){Object.assign(ex,fields);ex.km=dist(ex.points);r=ex;saveOwn()}
  else{
    r=Object.assign({id:'u'+Date.now(),owner:state.user.login,stops:[]},fields);
    state.routes.push(r);state.routes.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
    state.routes=state.routes.map(function(x,i){return x.color?Object.assign(x,{km:x.km||dist(x.points)}):prep(x,i)});
    saveOwn();
  }
  state.editId=null;setDrawing(false);if(draftLine){map.removeLayer(draftLine);draftLine=null}
  drawLines();renderStats();renderList();select(r.id);toast('Route gespeichert.');
}

/* ---------- Login ---------- */
function setUser(u){
  state.user=u;if(u){store('shm.user',JSON.stringify(u))}else{store('shm.user',null)}
  buildRoutes();drawLines();renderStats();renderList();renderAuth();
  if(state.selectedId&&!byId(state.selectedId)){deselect()}
}
function renderAuth(){
  var a=$('#auth');
  if(!state.user){a.innerHTML='<button type="button" class="btn twitch" id="login">Mit Twitch anmelden</button>';return}
  var u=state.user,ini=esc((u.display||u.login||'?').charAt(0).toUpperCase());
  a.innerHTML='<div class="chip" title="'+(u.demo?'Demo-Login: keine Twitch-Client-ID hinterlegt':'Mit Twitch angemeldet')+'"><span class="av">'+ini+(u.avatar?'<img src="'+esc(u.avatar)+'" alt="" onerror="this.remove()">':'')+'</span>'+esc(u.display||u.login)+'</div>'+
    (canEdit(u)?'<button type="button" class="btn primary" id="add">Stream hinzufügen</button>':'')+'<button type="button" class="btn ghost" id="logout">Abmelden</button>';
}
function login(){
  if(!CONFIG.twitchClientId){setUser({login:'demo',display:'Demo-Streamer',demo:true});toast('Demo-Login aktiv. Trage eine Twitch-Client-ID ein, um echtes Twitch-Login zu nutzen.');return}
  var st=Math.random().toString(36).slice(2)+Date.now().toString(36);sstore('shm.state',st);
  var ru=location.origin+location.pathname;
  location.href='https://id.twitch.tv/oauth2/authorize?client_id='+encodeURIComponent(CONFIG.twitchClientId)+'&redirect_uri='+encodeURIComponent(ru)+'&response_type=token&scope='+encodeURIComponent(CONFIG.scopes)+'&state='+encodeURIComponent(st);
}
function handleRedirect(){
  var h=location.hash;if(h.indexOf('access_token=')<0)return Promise.resolve(false);
  var p=new URLSearchParams(h.slice(1)),tok=p.get('access_token'),st=p.get('state');
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(!tok||!st||st!==sstore('shm.state')){toast('Twitch-Login abgebrochen.');return Promise.resolve(false)}
  sstore('shm.state',null);
  return fetch('https://api.twitch.tv/helix/users',{headers:{Authorization:'Bearer '+tok,'Client-Id':CONFIG.twitchClientId}})
    .then(function(r){return r.json()}).then(function(j){var u=j.data&&j.data[0];if(!u)throw 0;setUser({login:u.login,display:u.display_name,avatar:u.profile_image_url});toast('Angemeldet als '+u.display_name+'.');return true})
    .catch(function(){toast('Twitch-Login fehlgeschlagen.');return false});
}

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,a');if(!t)return;
  if(t.classList.contains('card')){select(t.dataset.id);return}
  if(t.classList.contains('gp-item')){hideTip(true);select(t.dataset.id);return}
  if(t.classList.contains('gp-all')){showInList(t.dataset.loc);return}
  if(t.dataset.stop!==undefined){var m=stopMarkers[+t.dataset.stop];if(m){map.flyTo(m.getLatLng(),Math.max(map.getZoom(),16),{duration:reduceMotion?0:.6});m.openPopup()}return}
  switch(t.id){
    case 'back':deselect();break;
    case 'qclear':setQuery('');$('#q').focus();break;
    case 'moreclips':document.querySelectorAll('.clip.more').forEach(function(x){x.hidden=false});t.remove();break;
    case 'login':login();break;
    case 'logout':setUser(null);toast('Abgemeldet.');break;
    case 'add':if(canEdit(state.user))openForm();break;
    case 'edit':if(canEdit(state.user))openForm(state.selectedId);break;
    case 'f-cancel':closeForm();break;
    case 'btn-draw':state.draft.points=state.draft.points.slice();setDrawing(true);break;
    case 'draw-undo':state.draft.points.pop();updateDraft();break;
    case 'draw-done':setDrawing(false);if(state.draft.points.length>1){map.fitBounds(L.polyline(state.draft.points).getBounds(),{padding:[50,50]})}break;
    case 'copyjson':
      var r=byId(state.selectedId),c=Object.assign({},r);delete c.km;
      var txt=JSON.stringify(c,null,2);
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('JSON kopiert.')},function(){toast('Kopieren wird hier nicht unterstützt.')});break;
    case 'del':
      if(t.dataset.arm){var id=state.selectedId;state.routes=state.routes.filter(function(x){return x.id!==id});saveOwn();drawLines();renderStats();renderList();deselect();toast('Route gelöscht.')}
      else{t.dataset.arm='1';t.textContent='Wirklich löschen?';setTimeout(function(){if(t.isConnected){delete t.dataset.arm;t.textContent='Löschen'}},4000)}
      break;
  }
});
function setQuery(v){state.query=v;$('#q').value=v;$('#qclear').hidden=!v;renderList()}
$('#q').addEventListener('input',function(e){setQuery(e.target.value)});
$('#q').addEventListener('keydown',function(e){if(e.key==='Escape'&&e.target.value){setQuery('');e.preventDefault()}});
$('#flt').addEventListener('change',function(e){state.filter=e.target.value;renderList()});
$('#srt').addEventListener('change',function(e){state.sort=e.target.value;renderList();$('#panel').scrollTop=0});
$('#v-form').addEventListener('submit',submitForm);
$('#f-gpx').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var fr=new FileReader();
  fr.onload=function(){
    try{
      var g=parseGpx(String(fr.result));state.draft.points=g.points;updateDraft();
      if(g.t0&&g.t1){
        $('#f-date').value=g.t0.getFullYear()+'-'+pad2(g.t0.getMonth()+1)+'-'+pad2(g.t0.getDate());
        $('#f-start').value=pad2(g.t0.getHours())+':'+pad2(g.t0.getMinutes());
        $('#f-dur').value=Math.max(1,Math.round((g.t1-g.t0)/60000));
      }
      map.fitBounds(L.polyline(g.points).getBounds(),{padding:[50,50]});$('#f-err').textContent='';
    }catch(ex){$('#f-err').textContent=ex.message||'GPX konnte nicht gelesen werden.'}
  };
  fr.onerror=function(){$('#f-err').textContent='Datei konnte nicht gelesen werden.'};
  fr.readAsText(f);
});

/* ---------- Start ---------- */
(function boot(){
  try{var u=JSON.parse(store('shm.user')||'null');if(u&&u.login)state.user=u}catch(e){}
  buildRoutes();initMap();drawLines();fitAll();renderStats();renderList();renderAuth();
  handleRedirect();
  // Aktuelle Daten laden (werden 2x täglich automatisch von Twitch aktualisiert). Ohne Server bleibt der eingebettete Stand.
  if(location.protocol!=='file:'&&window.fetch){
    fetch('data/streams.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null}).then(function(d){
      if(!Array.isArray(d)||!d.length)return;
      SAMPLE=d;var sel=state.selectedId;buildRoutes();drawLines();renderStats();renderList();
      if(sel&&byId(sel))select(sel);else if(!sel)fitAll();
    }).catch(function(){});
    fetch('data/meta.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null}).then(function(m){
      if(m&&m.profileImage){var av=document.querySelector('.avatar img');if(!av){av=document.createElement('img');av.alt='';document.querySelector('.avatar').appendChild(av)}av.src=m.profileImage}
      if(m&&m.updated){var d=new Date(m.updated);$('#upd').textContent='Automatisch aktualisiert: '+d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' Uhr'}
    }).catch(function(){});
  }
})();
})();
</script>
